# Local project service, no DHCP; exact records shared by both resolvers.
port=53
listen-address=10.7.7.242
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
local=/codexers.test/
local-ttl=30
host-record=app.codexers.test,10.7.7.242,30
host-record=api.codexers.test,10.7.7.242,30
log-queries=extra
log-facility=/private/tmp/cn-phase2-USER/dns-backup/dns.log
pid-file=/private/tmp/cn-phase2-USER/dns-backup/service.pid
