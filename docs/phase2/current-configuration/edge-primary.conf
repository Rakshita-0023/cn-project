# Root master drops workers to a distinct identity for two-Mac pf isolation.
user _www;
worker_processes 1;
pid "/private/tmp/cn-phase2-USER/edge-primary/service.pid";
error_log "/private/tmp/cn-phase2-USER/edge-primary/error.log" info;
events { worker_connections 256; }
http {
    default_type application/json;
    log_format course '$time_iso8601 client=$remote_addr:$remote_port request="$request" '
        'status=$status tls=$ssl_protocol upstream=$upstream_addr '
        'upstream_status=$upstream_status backend=$upstream_http_x_backend elapsed=$request_time';
    access_log "/private/tmp/cn-phase2-USER/edge-primary/access.log" course;
    client_body_temp_path "/private/tmp/cn-phase2-USER/edge-primary/client_temp";
    proxy_temp_path "/private/tmp/cn-phase2-USER/edge-primary/proxy_temp";
    upstream course_backends {
        server 10.7.12.26:3001 max_fails=1 fail_timeout=5s;
        server 10.7.7.242:3002 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 10.7.7.242:8080;
        server_name app.codexers.test api.codexers.test;
        return 308 https://$host:8443$request_uri;
    }
    server {
        listen 10.7.7.242:8443 ssl;
        server_name app.codexers.test api.codexers.test;
        ssl_certificate "/PROJECT/phase2/tls/edge-primary/server.crt";
        ssl_certificate_key "/PROJECT/phase2/tls/edge-primary/server.key";
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Edge "edge-primary" always;
        location / {
            proxy_pass http://course_backends;
            proxy_bind 10.7.7.242;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 8s;
            proxy_intercept_errors on;
        }
        error_page 502 503 504 =502 /__upstream_unavailable;
        location = /__upstream_unavailable {
            internal;
            add_header X-Edge "edge-primary" always;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":"both backend upstreams unavailable"}\n';
        }
    }
}
