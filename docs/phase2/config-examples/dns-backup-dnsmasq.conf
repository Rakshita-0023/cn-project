# Local project service, no DHCP; exact records shared by both resolvers.
port=53
listen-address=192.168.1.20
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
local=/team1.test/
local-ttl=30
host-record=app.team1.test,192.168.1.20,30
host-record=api.team1.test,192.168.1.20,30
log-queries=extra
log-facility=/private/tmp/cn-phase2-USER/dns-backup/dns.log
pid-file=/private/tmp/cn-phase2-USER/dns-backup/service.pid
